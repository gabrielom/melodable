[package]
name = "rhythm-trainer"
version = "0.1.0"
description = "Rhythm Trainer — timing trainer for pads and piano"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"

# M6: Ableton Link. Enable with `cargo build --features link`
# rusty_link = { version = "0.4", optional = true }

[features]
default = []
link = []
# link = ["dep:rusty_link"]   # <- swap to this when adding rusty_link in M6

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
