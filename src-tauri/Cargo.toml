[package]
name = "melodable"
version = "0.1.0"
description = "Melodable — timing trainer for pads and piano"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# The binary is capitalised while the crate is not, on purpose.
#
# `tauri dev` on macOS runs this executable directly — there is no `.app` — so
# the name macOS shows under the Dock icon and in cmd-tab is the *filename*.
# With the crate's own name it read "rhythm-trainer", and lowercase after the
# rename. A bundled build takes its name from `productName` instead, so this
# only governs dev; Tauri's own docs point at this field rather than
# `mainBinaryName`, which is applied at bundle time and so never reaches dev.
[[bin]]
name = "Melodable"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
midir = "0.10"
# Ableton Link (M6). Feature-gated: needs CMake to build, so the app must
# still compile and run with the feature off.
rusty_link = { version = "0.4", optional = true }

[features]
default = ["link"]
link = ["dep:rusty_link"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
